name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Elixir, React, and browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1.24.1
        with:
          otp-version: '27.3'
          elixir-version: '1.18.3'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Elixir build tools
        run: |
          mix local.hex --force
          mix local.rebar --force
      - name: Install dependencies
        run: make setup
      - name: Check formatting, tests, build, and frontend dependencies
        run: make check
      - name: Install test browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Exercise solo and multiplayer flows
        run: make e2e
